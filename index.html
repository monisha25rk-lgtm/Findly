<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f5">
    <title>Foundly — Lost and found</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Foundly home">
        <span>Foundly</span>
      </a>
      <span class="topbar-note">Lost &amp; found</span>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Lost something or found something?</h1>
        <p class="intro-copy">Share a few details about the item to help it find its way home.</p>
      </section>

      <section class="form-card" aria-labelledby="form-heading">
        <div class="form-card-heading">
          <div>
            <h2 id="form-heading">Report an item</h2>
          </div>
        </div>

        <div class="report-switch" role="group" aria-label="Report type">
          <button class="report-option is-active" type="button" data-report-type="lost" aria-pressed="true">
            I lost something
          </button>
          <button class="report-option" type="button" data-report-type="found" aria-pressed="false">
            I found something
          </button>
        </div>

        <p class="form-hint" id="form-hint">Let’s start with the item you’re looking for.</p>

        <form id="report-form" novalidate>
          <div class="field-grid">
            <div class="field field-wide">
              <label for="item-name">Item name <span class="required-mark">*</span></label>
              <input id="item-name" name="itemName" type="text" placeholder="e.g. Canvas tote bag" autocomplete="off" required minlength="2" maxlength="80" aria-describedby="item-name-error">
              <p class="field-error" id="item-name-error"></p>
            </div>

            <div class="field">
              <label for="category">Category <span class="required-mark">*</span></label>
              <div class="select-wrap">
                <select id="category" name="category" required aria-describedby="category-error">
                  <option value="" selected disabled>Select a category</option>
                  <option>Accessories</option>
                  <option>Clothing</option>
                  <option>Electronics</option>
                  <option>Keys &amp; cards</option>
                  <option>Bags &amp; luggage</option>
                  <option>Books &amp; stationery</option>
                  <option>Other</option>
                </select>
              </div>
              <p class="field-error" id="category-error"></p>
            </div>

            <div class="field">
              <label for="color">Color <span class="required-mark">*</span></label>
              <input id="color" name="color" type="text" placeholder="e.g. Forest green" autocomplete="off" required minlength="2" maxlength="40" aria-describedby="color-error">
              <p class="field-error" id="color-error"></p>
            </div>

            <div class="field field-wide">
              <label for="description">Description <span class="required-mark">*</span></label>
              <textarea id="description" name="description" rows="3" placeholder="Add details that make it easy to recognize, like a brand, pattern, or unique feature." required minlength="10" maxlength="500" aria-describedby="description-help description-error"></textarea>
              <div class="field-meta">
                <p class="field-help" id="description-help">At least 10 characters.</p>
                <span class="character-count" id="description-count" aria-live="polite">0 / 500</span>
              </div>
              <p class="field-error" id="description-error"></p>
            </div>

            <div class="field">
              <label for="location">Location <span class="required-mark">*</span></label>
              <input id="location" name="location" type="text" placeholder="e.g. North library, first floor" autocomplete="off" required minlength="3" maxlength="120" aria-describedby="location-error">
              <p class="field-error" id="location-error"></p>
            </div>

            <div class="field">
              <label for="date">Date <span class="required-mark">*</span></label>
              <input id="date" name="date" type="date" required aria-describedby="date-error">
              <p class="field-error" id="date-error"></p>
            </div>
          </div>

          <div class="form-footer">
            <p class="required-note"><span class="required-mark">*</span> Required fields</p>
            <button class="submit-button" type="submit">
              <span id="submit-label">Check report details</span>
            </button>
          </div>
          <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

  </body>
</html>
